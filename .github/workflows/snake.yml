name: Generate Contribution Snake

on:
  schedule:
    # Run every day at midnight UTC
    - cron: "0 0 * * *"

  # Allows you to run it manually
  workflow_dispatch:

  # Also regenerate whenever README/workflow changes are pushed
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate green-purple snake
        uses: Platane/snk@v3
        with:
          github_user_name: Lakshbethariya

          outputs: |
            dist/github-snake.svg?color_snake=%23a855f7&color_dots=%23ebedf0,%23dcfce7,%2322c55e,%2316a34a,%2315803d
            dist/github-snake-dark.svg?color_snake=%23c084fc&color_dots=%23161b22,%23bbf7d0,%2322c55e,%2300ff88,%2300a83b

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
